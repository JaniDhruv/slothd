[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "slothd"
version = "0.1.0"
description = "🦥 The Sloth Daemon — an air-gapped, local-first AI file tidier that runs only when your system is idle."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [
    {name = "Jani Dhruv"},
]
keywords = ["ai", "file-organizer", "gemma", "local-first", "privacy", "ollama"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Desktop Environment :: File Managers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Core engine
    "click>=8.1",
    "rich>=13.0",
    "pydantic>=2.0",

    # AI / Ollama
    "ollama>=0.4",

    # PDF handling
    "pymupdf>=1.24",

    # Web dashboard
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",

    # Database (Tiger Data pgvector)
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",

    # Observability
    "sentry-sdk[fastapi]>=2.0",

    # Scheduling
    "apscheduler>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
]
enrich = [
    # Optional online enrichment (--enrich-online flag)
    "google-search-results>=2.4",  # SerpApi
]

[project.scripts]
slothd = "slothd.cli:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
